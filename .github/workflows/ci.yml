name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Vet
        env:
          GOWORK: "off"
        run: go vet ./...
      - name: Check error catalog
        env:
          GOWORK: "off"
        run: go run ./cmd/errorcatalog --check
      - name: Check OpenAPI contract
        env:
          GOWORK: "off"
          GF_GCFG_FILE: manifest/config/config.example.yaml
          GF_OIDC_GLOBALSECRET: openapi-export-only-secret-32-bytes-minimum
          PLATFORM_OPENAPI_OUTPUT: contracts/openapi.json
        run: |
          go run ./cmd/identity
          git diff --exit-code -- contracts/openapi.json
      - name: Build
        env:
          GOWORK: "off"
        run: go build ./cmd/identity ./cmd/publishertrust ./cmd/errorcatalog

  account:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: account/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  identity-nuxt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Verify package
        run: pnpm pack --dry-run

  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: identity
            file: Dockerfile
            context: .
          - name: account
            file: account/Dockerfile
            context: account
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --file ${{ matrix.file }} --tag ${{ matrix.name }}:ci ${{ matrix.context }}
