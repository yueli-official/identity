# CONFIG TEMPLATE — once: cp config.example.yaml config.yaml, then set local values (DB host 192.168.5.5).
# Real config.yaml is GITIGNORED. Platform standard: backend-platform-conventions §7.
server:
  address: "127.0.0.1:8081"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
cookie:
  secure: true
# DB: GoFrame's pgsql driver builds the DSN from the structured fields below (it
# does NOT parse `link`); dev sets host to 192.168.5.5 (local-dev-gotchas §6).
# Redis: set address below, or override via GF_REDIS_DEFAULT_ADDRESS at runtime.
database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "identity"
redis:
  default:
    address: ""  # override via GF_REDIS_DEFAULT_ADDRESS env var at runtime
    db: 0
oidc:
  issuer: "http://localhost:8081"
  refreshTtl: "720h"      # 30 days; access/id tokens stay 10m (set in code)
  globalSecret: ""        # set via env GF_OIDC_GLOBALSECRET (>=32 bytes), never commit a real value
  google:
    clientId: ""        # set via env GF_OIDC_GOOGLE_CLIENTID
    clientSecret: ""    # set via env GF_OIDC_GOOGLE_CLIENTSECRET
    redirectUrl: "http://localhost:3000/api/v1/auth/oauth/google/callback"  # env GF_OIDC_GOOGLE_REDIRECTURL
account:
  loginUrl: "http://localhost:3000/login"
  baseUrl: "http://localhost:3000"   # env GF_ACCOUNT_BASEURL — used to build email links
rbac:
  # The default role granted to new identities is the DefaultRole const in
  # internal/logic/roles.go (kept in lockstep with the migration 0006 seed),
  # not a config value — so no defaultRole key here.
  bootstrapAdminEmail: ""   # env GF_RBAC_BOOTSTRAPADMINEMAIL — granted admin at startup if the identity exists
mail:
  smtp:
    host: ""        # env GF_MAIL_SMTP_HOST — empty ⇒ dev-log mailer
    port: "465"     # env GF_MAIL_SMTP_PORT — implicit TLS
    username: ""    # env GF_MAIL_SMTP_USERNAME
    password: ""    # env GF_MAIL_SMTP_PASSWORD
  from: ""          # env GF_MAIL_FROM
  fromName: "用户中心"  # env GF_MAIL_FROMNAME
