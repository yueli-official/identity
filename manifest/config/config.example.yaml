# CONFIG TEMPLATE — once: cp config.example.yaml config.yaml, then set local values (DB host 192.168.5.5).
# Real config.yaml is GITIGNORED. Platform standard: backend-platform-conventions §7.
server:
  address: "127.0.0.1:8081"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
cookie:
  secure: true
# DB: GoFrame's pgsql driver builds the DSN from the structured fields below (it
# does NOT parse `link`); dev sets host to 192.168.5.5 (local-dev-gotchas §6).
# Redis: set address below, or override via GF_REDIS_DEFAULT_ADDRESS at runtime.
database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "identity"
redis:
  default:
    address: "" # override via GF_REDIS_DEFAULT_ADDRESS env var at runtime
    db: 0
auth:
  sessionIdleTtl: "720h" # 30 days; Redis is a cache, PG remains the durable session source
webauthn:
  # rpId is the registrable account-domain suffix, never a URL. Every origin
  # must exactly match a browser origin allowed to create/use credentials.
  rpId: "account.example.com"
  displayName: "月离账户"
  origins:
    - "https://account.example.com"
  topOrigins: [] # only needed for explicitly trusted cross-origin iframe ceremonies
  allowCrossOrigin: false
  ceremonyTtl: "5m"
mfa:
  transactionTtl: "5m"
  recoverySessionTtl: "15m"
  totp:
    # Stable issuer shown by authenticator apps. Changing it does not invalidate
    # enrolled secrets, but produces confusing duplicate-looking account labels.
    issuer: "月离账户"
abuse:
  turnstile:
    secret: "" # optional; set via secret manager to enable challenge escalation
    endpoint: "" # empty uses Cloudflare Siteverify
    hostnames: [] # trusted public account hostnames, never derive from the request Host
guest:
  maxSessionTtl: "720h" # site BFF supplies its requested TTL; Identity enforces this ceiling
  accessTokenTtl: "10m" # short-lived resource JWT, independent of the durable guest session
oidc:
  issuer: "http://localhost:8081"
  audience: "identity-api" # audience for scoped machine discovery tokens
  refreshTtl: "720h" # 30 days; access/id tokens stay 10m (set in code)
  globalSecret: "" # set via env GF_OIDC_GLOBALSECRET (>=32 bytes), never commit a real value
  google:
    clientId: "" # set via env GF_OIDC_GOOGLE_CLIENTID
    clientSecret: "" # set via env GF_OIDC_GOOGLE_CLIENTSECRET
    redirectUrl: "http://localhost:3000/api/v1/auth/oauth/google/callback" # env GF_OIDC_GOOGLE_REDIRECTURL
account:
  loginUrl: "http://localhost:3000/login"
  baseUrl: "http://localhost:3000" # env GF_ACCOUNT_BASEURL — used to build email links
publisher:
  # local-file is development-only and creates a 0600 P-256 PEM at keyFile.
  # Production must provide a KMS/HSM KeyProvider adapter before enabling signing.
  mode: "local-file"
  keyFile: "publisher-signing-key.pem"
  consumers:
    - audience: "urn:yueli:registry:yotta"
      instance: "urn:yueli:platform-instance:local"
      enabled: true
      artifactKinds:
        workflow-release: "application/vnd.yueli.workflow-release.v1+json"
        node-package-release: "application/vnd.yueli.node-package-release.v1+json"
maintenance:
  securityRetention:
    enabled: true
    interval: "1h"
    retention: "24h"
    batchSize: 500
asset:
  baseUrl: "http://localhost:8082"
  audience: "asset-api"
commerce:
  baseUrl: "http://localhost:8084"
  audience: "commerce-api"
notification:
  baseUrl: "http://localhost:8089"
  audience: "notification-api"
  tokenUrl: "http://localhost:8081/oauth2/token"
  clientId: "identity-notification-svc"
  clientSecret: ""
  scope: "notification:send"
privacy:
  # Every independent site instance has its own Owner key and credential.
  # Deployed endpoints use HTTPS unless an isolated internal network explicitly
  # sets allowInsecureHttp while workload TLS is unavailable.
  tokenUrl: "http://localhost:8081/oauth2/token"
  owners:
    - key: "notification"
      kind: "notification"
      url: "http://localhost:8089/api/internal/privacy/owner"
      clientId: "identity-notification-privacy-svc"
      clientSecret: ""
      allowInsecureHttp: false
    - key: "site.blog-local"
      kind: "blog"
      url: "http://localhost:8085/api/internal/privacy/owner"
      clientId: "identity-blog-local-privacy"
      clientSecret: ""
      allowInsecureHttp: false
rbac:
  # The default role granted to new identities is the DefaultRole const in
  # internal/logic/roles.go (kept in lockstep with the migration 0006 seed),
  # not a config value — so no defaultRole key here.
  bootstrapAdminEmail: "" # env GF_RBAC_BOOTSTRAPADMINEMAIL — granted admin at startup if the identity exists
